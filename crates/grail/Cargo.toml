[package]
name = "grail"
description = "GRAILS: grain- and line-art-aware video quality score on the SSIMULACRA2 scale"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "grail"
path = "src/main.rs"

[features]
# CUDA / HIP select the kernels of grail-gpu (Linux, Windows); macOS always uses grail-metal
default = ["cuda"]
cuda = ["grail-gpu/cuda"]
hip = ["grail-gpu/hip"]

[dependencies]
grail-stages = { path = "../grail-stages" }
anyhow.workspace = true
libloading.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true

[target.'cfg(not(target_os = "macos"))'.dependencies]
grail-gpu = { path = "../grail-gpu", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
grail-metal = { path = "../grail-metal" }
