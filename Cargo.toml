[workspace]
resolver = "2"
members = ["crates/grail-stages", "crates/grail-gpu", "crates/grail-metal", "crates/grail"]

[workspace.package]
version = "0.1.0-beta.2"
edition = "2021"
license = "GPL-3.0-only"   # with a section 7 additional permission for libvship: LICENSE-EXCEPTION.md
repository = ""

[workspace.dependencies]
anyhow = "1.0.100"
libloading = "0.8.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
clap = { version = "4.6.0", features = ["derive"] }

[profile.release]
opt-level = 3
debug = 1
